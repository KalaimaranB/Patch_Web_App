title: Patch Medical — Documentation
description: Official documentation for the Patch Medical caregiver dashboard web application.
baseurl: "/Patch_Web_App"
url: "https://kalaimaranb.github.io"

theme: just-the-docs

# Brand color scheme (matches the app's blue-600 palette)
color_scheme: patch

# Aux links (shown in header)
aux_links:
  "Open App ↗":
    - "https://patch-web-app.vercel.app/login"
aux_links_new_tab: true

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  rel_url: true
  button: false

# Navigation
nav_enabled: true
nav_sort: order

# Footer
footer_content: "© 2025 Patch Medical Technologies. Documentation reflects the current state of the application."

# Back to top
back_to_top: true
back_to_top_text: "Back to top"

# Heading anchors
heading_anchors: true

# Kramdown
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Exclude from build
exclude:
  - Gemfile.lock
  - node_modules/
