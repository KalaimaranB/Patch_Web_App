title: Patch Medical — Documentation
description: Official documentation for the Patch Medical caregiver dashboard web application.
baseurl: "/Patch_Web_App"
url: "https://kalaimaranb.github.io"

remote_theme: just-the-docs/just-the-docs@v0.10.0

# Color scheme override via custom SCSS
color_scheme: patch

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

# Aux links (shown in header)
aux_links:
  "Open App ↗":
    - "https://patch-web-app.vercel.app/login"
aux_links_new_tab: true

# Navigation
nav_enabled: true
nav_sort: order  # use nav_order front matter

# Footer
footer_content: "© 2025 Patch Medical Technologies. Documentation reflects the current state of the application."

# Back to top
back_to_top: true
back_to_top_text: "Back to top"

# Heading anchors
heading_anchors: true

# Last modified date
last_edit_time_format: "%b %e %Y at %I:%M %p"

# Collections for nav
collections:
  pages:
    permalink: "/:path/"
    output: true

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata

# Kramdown
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Exclude from build
exclude:
  - Gemfile.lock
  - node_modules/
